name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TODO: lintエラー修正後に有効化
      # - name: Lint
      #   run: pnpm lint

      # changeset のパッケージ名の誤りを PR 時点で捕まえる。
      # 存在しない / ignore 済みのパッケージを指していると失敗するので、
      # main にマージしてからリリースが落ちるのを防げる。
      #
      # status ではなく version を空打ちするのは、status が main との差分を
      # 取るため shallow clone では動かないから。version は .changeset を
      # 読むだけで git 履歴を要らない（release.yml も同じ条件で動いている）。
      # 生成物は使わないので破棄する。
      #
      # version は changeset が 0 件だと exit 1 になる（リリース PR は
      # 消費済みでこの状態）。先に件数を数えてスキップする。
      - name: Validate changesets
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "changeset なし。検証をスキップする"
            exit 0
          fi
          pnpm changeset version
          git checkout -- . && git clean -fd

      - name: Build
        run: pnpm build

      # TODO: Playwright セットアップ後に有効化
      # - name: Test
      #   run: pnpm test

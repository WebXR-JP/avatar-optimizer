name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TODO: lintエラー修正後に有効化
      # - name: Lint
      #   run: pnpm lint

      # changeset のパッケージ名の誤りを PR 時点で捕まえる。
      # 存在しない/ignore 済みのパッケージを指していると失敗するため、
      # main にマージしてからリリースが落ちるのを防げる
      - name: Validate changesets
        run: pnpm changeset status

      - name: Build
        run: pnpm build

      # TODO: Playwright セットアップ後に有効化
      # - name: Test
      #   run: pnpm test

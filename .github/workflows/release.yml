name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # npm は 2 つの役割で使われる。
      # 1. Trusted Publishers (OIDC) の publish → npm >= 11.5.1 が必要
      # 2. changesets の公開済み判定。pnpm ワークスペースでは `pnpm info --json` が
      #    使われるが、pnpm はこれを npm へパススルーする（pnpm.cjs の
      #    passThruToNpm、runNpm が PATH から npm を解決する）
      #
      # npm 12 は `info --json` の出力をオブジェクトから配列に変更した。
      # changesets 3.x は npm 経路（parseInfoResult$1）では配列に対応したが、
      # pnpm 経路（parseInfoResult）は `JSON.parse(stdout)` のみで未対応のため、
      # versions が undefined になり publish が落ちる。
      # 1 を満たしつつ 12 系を避けるため、メジャーを 11 に固定する
      - name: Setup npm for publish
        run: npm install -g npm@^11.5.1

      # 上記の前提が崩れていないか、実際に使われる `pnpm info --json` で確認する。
      # 崩れたまま進むと publish 時まで失敗が表面化しない
      - name: Verify pnpm info output shape
        run: |
          pnpm info pnpm --json \
            | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const parsed = JSON.parse(s);
                if (Array.isArray(parsed) || !parsed.versions) {
                  console.error(
                    "pnpm info --json の出力形式が変わっています。" +
                    "changesets の公開済み判定が壊れるため npm のバージョンを見直してください。"
                  );
                  process.exit(1);
                }
                console.log("pnpm info --json: OK (object)");
              });
            '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # v2 は @changesets/cli 3.x が前提（v1 は CLI 3.x を弾く）。
      # 入力名が kebab-case になり、token は env ではなく github-token で渡す
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2.1.1
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
          github-token: ${{ secrets.GH_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: true

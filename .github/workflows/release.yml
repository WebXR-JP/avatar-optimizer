name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishers (OIDC) には npm >= 11.5.1 が必要。
      # pnpm publish が内部で npm に委譲するため、npm 側のバージョンが効く
      - name: Setup npm for publish
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # v2 は @changesets/cli 3.x が前提（v1 は CLI 3.x を弾く）。
      # 入力名が kebab-case になり、token は env ではなく github-token で渡す
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          commit-message: 'chore: release packages'
          pr-title: 'chore: release packages'
          github-token: ${{ secrets.GH_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: true

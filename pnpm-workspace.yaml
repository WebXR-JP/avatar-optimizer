packages:
  - 'packages/avatar-optimizer'
  - 'packages/texture-atlas'
  - 'packages/texture-compression'
  - 'packages/debug-viewer'
  - 'packages/mtoon-atlas'
# 依存パッケージの build scripts を実行するかの明示的な許可リスト。
# 未指定のまま放置すると pnpm install が ERR_PNPM_IGNORED_BUILDS (exit 1) になり、
# CI の `pnpm install --frozen-lockfile` が落ちて release ワークフロー全体が失敗する。
# 全パッケージとも build scripts なしで動作実績があるため false（従来挙動の明文化）。
allowBuilds:
  '@swc/core': false
  canvas: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  msw: false
  webgpu: false
# three r187 で `three/tsl` から `transformedNormalView` が削除され、three-vrm 3.4.4〜3.5.5 の
# `@pixiv/three-vrm/nodes`（MToonNodeMaterial）が import 時に失敗する。上流の修正
# （https://github.com/pixiv/three-vrm/pull/1890）と同じく `normalView` に置き換えている。
# three-vrm が修正版をリリースしたら、更新してこのパッチを削除すること。
patchedDependencies:
  '@pixiv/three-vrm@3.4.4': patches/@pixiv__three-vrm@3.4.4.patch
